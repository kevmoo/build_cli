name: build_cli
version: 2.3.0
description: >-
  Parse command line arguments directly into an annotation class
  using the power of build_runner and source_gen.
homepage: https://github.com/kevmoo/build_cli

environment:
  sdk: ^3.12.0

resolution: workspace

executables:
  build_cli:

dependencies:
  analyzer: ">=13.0.0 <15.0.0"
  args: ^2.6.0
  build: ^4.0.4
  # Limit version range on build_cli_annotations
  # new features need to stay in sync
  build_cli_annotations: ">=2.1.1 <2.2.0"
  build_config: ^1.2.0
  cli_util: ^0.6.0
  dart_style: ^3.1.2
  path: ^1.9.0
  pub_semver: ^2.1.4
  source_gen: ^4.1.2
  source_helper: ^1.3.10
  yaml: ^3.1.3

dev_dependencies:
  api_summary: ^1.2.0
  build_runner: ^2.10.5
  build_verify: ^3.0.0
  checks: ^0.3.1
  dart_flutter_team_lints: ^3.2.0
  io: ^1.0.0
  source_gen_test: ^1.3.4
  test: ^1.29.0
